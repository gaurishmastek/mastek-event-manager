<div class="mx-auto flex min-h-screen max-w-sm flex-col justify-center px-4 py-8">
  <app-card>
    <div class="space-y-4 p-6">
      <div>
        <h1 class="text-lg font-semibold">Security officer sign in</h1>
        <p class="text-sm text-muted-foreground">Mastek Event Manager · Gate</p>
      </div>

      <form class="space-y-4" novalidate (ngSubmit)="signIn()">
        <div>
          <label for="officer-email" class="mb-1 block text-sm font-medium">Registered email</label>
          <input
            id="officer-email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="username"
            maxlength="254"
            required
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            class="flex h-12 w-full rounded-md border border-input bg-background px-3 text-base focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
          />
        </div>
        <div>
          <label for="officer-password" class="mb-1 block text-sm font-medium">Password</label>
          <input
            id="officer-password"
            name="password"
            type="password"
            autocomplete="current-password"
            [attr.maxlength]="passwordMaxLength"
            required
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            class="flex h-12 w-full rounded-md border border-input bg-background px-3 text-base focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
          />
          <p class="mt-1 text-xs text-muted-foreground">Your administrator gives you this password.</p>
        </div>
        @if (errorMessage()) {
          <p class="text-sm text-destructive" role="alert">{{ errorMessage() }}</p>
        }
        <app-button type="submit" [loading]="submitting()" [disabled]="!canSubmit()" class="block w-full">Sign in</app-button>
      </form>
    </div>
  </app-card>
</div>
