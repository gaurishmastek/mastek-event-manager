<div class="mx-auto flex min-h-screen max-w-sm flex-col justify-center px-4 py-8">
  <app-card>
    <div class="space-y-4 p-6">
      <div>
        <h1 class="text-lg font-semibold">Security officer sign in</h1>
        <p class="text-sm text-muted-foreground">Mastek Event Manager · Gate</p>
      </div>

      @if (step() === 'email') {
        <form class="space-y-4" novalidate (ngSubmit)="requestOtp()">
          <div>
            <label for="officer-email" class="mb-1 block text-sm font-medium">Registered email</label>
            <input
              id="officer-email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="email"
              maxlength="254"
              required
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              class="flex h-12 w-full rounded-md border border-input bg-background px-3 text-base focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
            />
            <p class="mt-1 text-xs text-muted-foreground">We email you a 6-digit code. Officers have no password.</p>
          </div>
          @if (errorMessage()) {
            <p class="text-sm text-destructive" role="alert">{{ errorMessage() }}</p>
          }
          <app-button type="submit" [loading]="submitting()" [disabled]="emailInvalid()" class="block w-full">Send code</app-button>
        </form>
      } @else {
        <form class="space-y-4" novalidate (ngSubmit)="verifyOtp()">
          <p class="text-sm text-muted-foreground" aria-live="polite" data-testid="code-sent">{{ infoMessage() }}</p>
          <div>
            <label for="officer-code" class="mb-1 block text-sm font-medium">6-digit code</label>
            <input
              id="officer-code"
              name="code"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]*"
              maxlength="6"
              required
              [ngModel]="code()"
              (ngModelChange)="onCodeInput($event)"
              class="flex h-14 w-full rounded-md border border-input bg-background px-3 text-center font-mono text-2xl tracking-[0.5em] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
            />
          </div>
          @if (errorMessage()) {
            <p class="text-sm text-destructive" role="alert">{{ errorMessage() }}</p>
          }
          <app-button type="submit" [loading]="submitting()" [disabled]="!codeValid()" class="block w-full">Sign in</app-button>

          <div class="flex items-center justify-between text-sm">
            <button type="button" class="text-muted-foreground underline" (click)="changeEmail()">Use a different email</button>
            <button
              type="button"
              class="text-primary underline disabled:text-muted-foreground disabled:no-underline"
              data-testid="resend"
              [disabled]="resendSecondsLeft() > 0 || resending()"
              (click)="resendOtp()"
            >
              @if (resendSecondsLeft() > 0) {
                Resend in {{ resendSecondsLeft() }}s
              } @else {
                {{ resending() ? 'Sending…' : 'Resend code' }}
              }
            </button>
          </div>
        </form>
      }
    </div>
  </app-card>
</div>
