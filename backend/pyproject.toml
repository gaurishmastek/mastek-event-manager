[project]
name = "mastek-event-manager-backend"
version = "0.1.0"
description = "FastAPI backend for the Mastek Event Manager"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.1",
    "alembic==1.20.0",
    "PyMySQL==1.2.3",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "PyJWT==2.15.0",
    "argon2-cffi==25.1.0",
    "cryptography==46.0.3",
    "segno==1.6.6",
    "mailtrap==2.10.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "UP042"]  # UP042: StrEnum changes str() of existing enums

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
